name: build-from-scratch (SDK)

on:
  pull_request:
    paths:
      - "docs/build-from-scratch/sdk/**"
      - ".github/workflows/build-from-scratch-sdk.yml"
  push:
    branches: [main]
    paths:
      - "docs/build-from-scratch/sdk/**"
      - ".github/workflows/build-from-scratch-sdk.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.step }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        step: [step-01, step-02, step-03, step-04]
    defaults:
      run:
        working-directory: docs/build-from-scratch/sdk/${{ matrix.step }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/build-from-scratch/sdk/${{ matrix.step }}/package-lock.json
      - run: npm ci
      - run: npm run generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
